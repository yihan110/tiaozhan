<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ app_name }}</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .fade-in { animation: fade .35s ease; }
  @keyframes fade { from {opacity:0; transform: translateY(6px);} to {opacity:1; transform:none;} }
  .score-bar { height: 8px; border-radius: 9999px; background: #e5e7eb; overflow: hidden; }
  .score-bar > div { height: 100%; background: linear-gradient(90deg,#6366f1,#8b5cf6); transition: width .6s ease; }
</style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-purple-50 min-h-screen text-slate-800">

<header class="max-w-5xl mx-auto px-4 pt-8 pb-4">
  <div class="flex items-center justify-between flex-wrap gap-2">
    <div>
      <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-slate-900">{{ app_name }}</h1>
      <p class="text-slate-500 mt-1 text-sm">输入一段文字 → AI 诊断 → 给出改写方向。无需注册，打开即用。</p>
    </div>
    <div class="text-xs px-3 py-1.5 rounded-full border
      {% if has_real_ai %}bg-emerald-50 text-emerald-700 border-emerald-200{% else %}bg-amber-50 text-amber-700 border-amber-200{% endif %}">
      {% if has_real_ai %}● 真实 AI 已启用{% else %}● 本地演示模式（配置 Key 后切换真实 AI）{% endif %}
    </div>
  </div>
</header>

<main class="max-w-5xl mx-auto px-4 pb-16 grid md:grid-cols-5 gap-6">

  <!-- 左侧：输入 -->
  <section class="md:col-span-3 bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
    <label class="block text-sm font-semibold mb-2">选择场景</label>
    <div id="modeTabs" class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-4"></div>
    <p id="modeHint" class="text-xs text-slate-500 mb-3"></p>

    <textarea id="inputText" rows="10"
      class="w-full border border-slate-300 rounded-xl p-3 text-sm leading-relaxed focus:ring-2 focus:ring-indigo-400 focus:outline-none"
      placeholder="把你的简历经历、文书段落、竞赛草稿或长文档粘贴到这里…"></textarea>

    <details class="mt-3 text-xs text-slate-500">
      <summary class="cursor-pointer">高级：临时使用自己的 AI Key（不会上传到服务器日志）</summary>
      <input id="apiKey" type="password" placeholder="sk-..." class="mt-2 w-full border rounded p-2 text-xs" />
      <p class="mt-1">留空则使用服务器端配置（若有）；都没有时进入本地演示模式。</p>
    </details>

    <button id="btnAnalyze"
      class="mt-4 w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold shadow transition">
      ✨ 开始 AI 分析
    </button>
    <p id="status" class="text-xs text-slate-500 mt-2"></p>
  </section>

  <!-- 右侧：结果 -->
  <section class="md:col-span-2">
    <div id="resultEmpty" class="bg-white rounded-2xl border border-dashed border-slate-300 p-6 text-center text-slate-400 text-sm">
      分析结果会出现在这里
    </div>
    <div id="resultBox" class="hidden"></div>
  </section>
</main>

<footer class="max-w-5xl mx-auto px-4 pb-8 text-center text-xs text-slate-400">
  v{{ version }} · 为软件工程学生的真实场景而做 · 数据仅在本次请求中处理
</footer>

<script>
const MODES = {{ modes|tojson }};
const tabs = document.getElementById('modeTabs');
const hint = document.getElementById('modeHint');
let currentMode = 'resume';

function renderTabs() {
  tabs.innerHTML = '';
  Object.entries(MODES).forEach(([k, v]) => {
    const btn = document.createElement('button');
    btn.textContent = v.label;
    btn.className = 'px-2 py-2 text-xs rounded-lg border transition ' +
      (k === currentMode
        ? 'bg-indigo-600 text-white border-indigo-600'
        : 'bg-white text-slate-600 border-slate-300 hover:border-indigo-400');
    btn.onclick = () => { currentMode = k; renderTabs(); };
    tabs.appendChild(btn);
  });
  hint.textContent = MODES[currentMode].hint;
}
renderTabs();

// ?demo=1 时自动填入样例并触发分析（方便演示与截图）
if (new URLSearchParams(location.search).get('demo') === '1') {
  document.getElementById('inputText').value =
    '在无人机社团担任副社长，组织过招新和多次技术分享活动，写过活动材料和申报书。' +
    '参加华为ICT大赛获得省级三等奖，也在上海一家公司实习过，做了一些前端页面和文档整理的工作。' +
    '英语四级考过一次，分数不太理想，正在准备下一次。';
  setTimeout(() => document.getElementById('btnAnalyze').click(), 600);
}

document.getElementById('btnAnalyze').onclick = async () => {
  const text = document.getElementById('inputText').value.trim();
  const status = document.getElementById('status');
  const box = document.getElementById('resultBox');
  const empty = document.getElementById('resultEmpty');
  if (!text) { status.textContent = '请先输入内容。'; return; }

  status.textContent = '分析中…';
  box.classList.add('hidden');

  const resp = await fetch('/api/analyze', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ text, mode: currentMode, api_key: document.getElementById('apiKey').value.trim() })
  });
  const data = await resp.json();
  status.textContent = '';

  if (data.error) {
    empty.classList.remove('hidden');
    empty.textContent = '出错了：' + data.error;
    return;
  }

  empty.classList.add('hidden');
  box.classList.remove('hidden');
  box.classList.add('fade-in');

  const s = data.scores || {};
  const bars = [
    ['综合分', s.overall], ['长度', s.length], ['结构', s.structure],
    ['简洁', s.conciseness], ['行动/数据', s.actionability]
  ].filter(([,v]) => v !== undefined);

  let html = `
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
      <div class="flex items-center justify-between mb-3">
        <span class="font-semibold">${data.mode_label}</span>
        <span class="text-xs px-2 py-1 rounded ${data.ai_mode==='real' ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}">
          ${data.ai_mode==='real' ? '真实 AI' : '本地演示'}
        </span>
      </div>
      <p class="text-[11px] text-slate-400 mb-3">${data.ai_mode_note || ''}</p>
      <div class="space-y-2 mb-4">
        ${bars.map(([k,v]) => `
          <div>
            <div class="flex justify-between text-xs text-slate-600"><span>${k}</span><span>${v}/100</span></div>
            <div class="score-bar"><div style="width:${v}%"></div></div>
          </div>`).join('')}
      </div>
      <div class="text-xs text-slate-500 mb-3">
        字符数 ${data.stats['字符数']} · 句子 ${data.stats['句子数']}
      </div>
      ${(data.sections||[]).map(sec => `
        <div class="mb-3">
          <div class="text-sm font-semibold text-slate-700 mb-1">${sec.title}</div>
          <pre class="whitespace-pre-wrap text-xs text-slate-600 bg-slate-50 rounded-lg p-3 leading-relaxed">${sec.content}</pre>
        </div>`).join('')}
    </div>`;
  box.innerHTML = html;
};
</script>
</body>
</html>
